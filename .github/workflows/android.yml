name: android

on:
  push:
    branches: [main, master, "vibe/*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync GUI into Android assets
        run: sh android/sync-gui.sh

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.10

      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug

      - name: Build release AAB (unsigned)
        run: cd android && ./gradlew :app:bundleRelease

      - name: Build + run server tests
        run: python3 -m unittest discover -s tests -v
        working-directory: .

      - uses: actions/upload-artifact@v4
        with:
          name: gitgui-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release-unsigned.aab

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
